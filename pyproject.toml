[project]
name = "crm-system"
version = "0.1.0"
description = ""
authors = [
    {name = "Andrey Vasilkov"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "django (>=6.1,<7.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "django-phonenumber-field (>=8.5.0,<9.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "phonenumbers (>=9.0.38,<10.0.0)",
    "psycopg[binary] (>=3.3.5,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "pylint (>=4.0.8,<5.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)"
]
