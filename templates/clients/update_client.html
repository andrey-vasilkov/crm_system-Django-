{% extends "base.html" %}

{% block title %}
Create User
{% endblock %}

{% block body %}
  <div><h2>Update profile {{ user.name }}</h2></div>
  <div><form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="button_div">
      <button type="submit" class="btn">Update</button>
      <a href="{% url 'clients:client_page' pk=object.pk %}" class="btn">Back to profile</a>
    </div>

  </form></div>


{% endblock %}
